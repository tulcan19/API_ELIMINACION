<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TikTok Repost Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <header>
      <div class="logo">🎵</div>
      <div class="header-text">
        <h1>Repost Cleaner</h1>
        <p>Gestor de compartidos</p>
      </div>
    </header>

    <div class="status-panel">
      <p id="status-message">Abre tu perfil en la pestaña "Compartidos" y escanea.</p>
    </div>

    <button id="btn-scan">🔍 Escanear Compartidos</button>

    <div class="selection-actions hidden" id="selection-actions">
      <button class="btn-secondary" id="btn-select-all">Seleccionar Todos</button>
      <button class="btn-danger" id="btn-delete-selected">🗑️ Eliminar</button>
    </div>

    <div id="progress-container" class="hidden">
      <div class="progress-track">
        <div id="progress-fill"></div>
      </div>
      <p id="progress-text">Eliminando: 0 / 0</p>
    </div>

    <div class="video-list-wrap">
      <ul id="video-list"></ul>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
