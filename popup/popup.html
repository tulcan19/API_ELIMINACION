<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TikTok Repost Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>TikTok Repost Cleaner</h1>
      <p class="subtitle">Gestor de compartidos</p>
    </header>

    <div id="status-panel" class="panel">
      <p id="status-message">Abre tu perfil de TikTok en la pestaña de 'Compartidos' (Reposts) para comenzar.</p>
    </div>

    <div class="actions">
      <button id="btn-scan" class="btn primary">🔍 Escanear Compartidos</button>
      <div class="selection-actions hidden" id="selection-actions">
        <button id="btn-select-all" class="btn secondary">Seleccionar Todos</button>
        <button id="btn-delete-selected" class="btn danger">🗑️ Eliminar Seleccionados</button>
      </div>
    </div>

    <div id="progress-container" class="hidden">
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <p id="progress-text">Eliminando: 0 / 0</p>
    </div>

    <div class="video-list-container">
      <ul id="video-list">
        <!-- Los videos escaneados aparecerán aquí -->
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
